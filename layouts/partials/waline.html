{{ if and site.Params.comments.enable (ne .Params.comments false) }}
<section class="comment-panel" id="comments">
  <p class="comment-panel__eyebrow">评论区</p>
  <h2>留言与补充</h2>
  <p class="comment-panel__desc"></p>

  <div id="waline"></div>
  <p id="waline-status" class="comment-panel__status" hidden></p>
  <noscript>
    <p class="comment-panel__status">当前浏览器禁用了 JavaScript，所以评论组件无法显示。</p>
  </noscript>
</section>

<script type="module">
  const walineRoot = document.getElementById('waline');
  const walineStatus = document.getElementById('waline-status');

  const showWalineStatus = (message) => {
    if (!walineStatus) return;
    walineStatus.hidden = false;
    walineStatus.textContent = message;
  };

  const enablePageview = {{ if site.Params.comments.pageview }}true{{ else }}false{{ end }};
  const enableReaction = {{ if site.Params.comments.reaction }}true{{ else }}false{{ end }};

  if (walineRoot) {
    try {
      const { init } = await import('https://unpkg.com/@waline/client@v3/dist/waline.js');

      const isLocal =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';

      init({
        el: walineRoot,
        serverURL: '{{ site.Params.comments.serverURL }}',
        lang: '{{ site.Params.comments.lang | default "zh-CN" }}',
        path: window.location.pathname,
        pageview: enablePageview && !isLocal,
        reaction: enableReaction,
        comment: '.waline-comment-count',
        search: false,
        emoji: [
          'https://cdn.jsdelivr.net/gh/norevi/blob-emoji-for-waline@2.0/blobs-png',
          'https://cdn.jsdelivr.net/gh/norevi/blob-emoji-for-waline@2.0/blobs-gif',
          'https://cdn.jsdelivr.net/gh/norevi/waline-blobcatemojis@1.0/blobs',
          'https://unpkg.com/@waline/emojis@1.4.0/tw-emoji',
          'https://unpkg.com/@waline/emojis@1.4.0/tw-sport',
          'https://unpkg.com/@waline/emojis@1.4.0/tw-body',
          'https://unpkg.com/@waline/emojis@1.4.0/tw-travel',
          'https://unpkg.com/@waline/emojis@1.4.0/tw-natural',
          'https://unpkg.com/@waline/emojis@1.4.0/tw-weather',
          'https://unpkg.com/@waline/emojis@1.4.0/tw-symbol'
        ],
        locale: {
          placeholder: '欢迎补充资料、勘误或继续讨论。评论功能无需登录，昵称栏留空默认显示“匿名”。'
        }
      });
    } catch (error) {
      console.error('Waline failed to initialize:', error);
      showWalineStatus('评论组件加载失败。请检查 Waline 的 serverURL、Waline 服务本身是否可访问，以及博客正式域名是否被 Waline 服务允许访问。');
    }
  }
</script>
{{ end }}
