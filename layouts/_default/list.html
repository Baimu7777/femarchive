{{ define "main" }}
<section class="panel">
  <div class="section-head">
    <div>
      <small>{{ if .IsSection }}Section{{ else }}Category{{ end }}</small>
      <h2>{{ .Title }}</h2>
      <p>{{ with .Description }}{{ . }}{{ else }}按时间浏览当前列表。{{ end }}</p>
    </div>
  </div>
  {{ if gt (len .Pages) 0 }}<div class="article-grid">{{ range .Pages.ByDate.Reverse }}{{ partial "post-card.html" . }}{{ end }}</div>{{ else }}<div class="empty">这里暂时还没有内容。</div>{{ end }}
</section>
{{ end }}
