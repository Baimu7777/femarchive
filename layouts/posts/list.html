{{ define "main" }}
  {{ $pages := sort .RegularPages "Date" "desc" }}
  {{ $paginator := .Paginate $pages }}
  <main class="archive-page archive-page--posts">
    <div class="shell archive-shell posts-layout">
      <section class="archive-panel posts-main">
        <a class="posts-category-entry" href="{{ "/categories/" | relLangURL }}">全部分类 <span aria-hidden="true">→</span></a>
        <section class="list-filter">
          <form
            class="local-filter search-box"
            data-local-filter
            data-target="#postsGrid"
            data-empty="#postsEmpty"
            data-pagination="#postsPagination"
            data-index-url="{{ "/index.json" | relLangURL }}"
            data-filter-section="posts"
            data-search-limit="12"
            data-search-step="12"
            data-search-mode="paginate"
          >
            <label class="sr-only" for="post-filter-input">搜索文章</label>
            <div class="search-box__field">
              <img class="search-box__icon" src="{{ "/icons/search.svg" | relLangURL }}" alt="" aria-hidden="true">
              <input id="post-filter-input" class="search-box__input" type="search" placeholder="搜索标题、摘要、标签" autocomplete="off">
              <button class="search-box__clear" type="button" data-search-clear aria-label="清空搜索" title="清空搜索" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2"/>
                </svg>
              </button>
            </div>
          </form>
        </section>

        <div class="archive-grid" id="postsGrid">
          {{ range $paginator.Pages }}
            {{ partial "card.html" (dict "page" .) }}
          {{ end }}
        </div>

        <p id="postsEmpty" class="empty-state" hidden>没有匹配的文章，换个关键词试试。</p>
        <div id="postsPagination">{{ template "_internal/pagination.html" . }}</div>
      </section>

    </div>
  </main>
{{ end }}
