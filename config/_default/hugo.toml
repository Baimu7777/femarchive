baseURL = "https://example.com/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "女阅组文库 / Feminist Archive"
hasCJKLanguage = true
enableRobotsTXT = true
timeZone = "Asia/Shanghai"
summaryLength = 28

[pagination]
  pagerSize = 9

[permalinks]
  posts = "/posts/:slugorfilename/"
  news = "/news/:slugorfilename/"
  figures = "/figures/:slugorfilename/"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "一个以女性议题、资料归档、新闻整理与原创长文为主的长期文库。"
  slogan = "姦如磐石"
  about = "为被限流、被删帖、被销号的女性之声建立存档，为女性思想创设可被稳定留存、被检索、被看见和铭记的平台。"
  infoLeft = "认可并践行 12BT，包括反性缘部分"
  infoRight = "豆瓣小组：全女评审团 · 书影音与评分"
  homeTopics = ["社会议题", "个人成长", "女权输出", "资料归档", "站务"]
  submitLabel = "前往投稿"
  submitURL = "/posts/submission-guidelines/"
  mainSections = ["posts", "news"]

  [params.author]
    name = "编辑部"

  [params.comments]
    enable = true
    provider = "waline"
    serverURL = "https://waline-one-mu-78.vercel.app"
    lang = "zh-CN"
    emoji = ["https://unpkg.com/@waline/emojis@1.1.0/weibo"]
    pageview = false
    reaction = false

[related]
  includeNewer = true
  threshold = 20
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 80

  [[related.indices]]
    name = "section"
    weight = 20

[[menu.main]]
  name = "主页"
  url = "/"
  weight = 10

[[menu.main]]
  name = "全部文章"
  url = "/posts/"
  weight = 20

[[menu.main]]
  name = "新闻"
  url = "/news/"
  weight = 30

[[menu.main]]
  name = "分类"
  url = "/categories/"
  weight = 40