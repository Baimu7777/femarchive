{{ define "main" }}
<section class="panel">
  <div class="section-head">
    <div>
      <small>Search</small>
      <h2>{{ .Title }}</h2>
      <p>{{ with .Description }}{{ . }}{{ else }}支持按标题、摘要、分类与标签检索。{{ end }}</p>
    </div>
  </div>
  <div class="toolbar">
    <input class="input" id="search-input" placeholder="输入关键词，例如：转载、平台、归档" />
    <select class="select" id="search-category"><option value="">全部分类</option></select>
    <select class="select" id="search-tag"><option value="">全部标签</option></select>
  </div>
  <div id="search-results"></div>
</section>
{{ end }}
{{ define "pageScript" }}<script src='{{ "js/filter-pages.js" | relURL }}'></script>{{ end }}
