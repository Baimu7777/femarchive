<div data-feedback-editor data-server="{{ site.Params.comments.serverURL }}" data-key="{{ site.Params.comments.turnstileKey }}" data-page="{{ if not .IsHome }}{{ .RelPermalink }}{{ end }}">
<form class="report-form"><label>昵称（选填）<input name="nick" maxlength="40" autocomplete="nickname"></label><label>问题说明<textarea name="detail" rows="4" required maxlength="10000"></textarea></label><div data-report-captcha></div><button type="submit">提交申报</button><p data-report-status role="status"></p></form></div>
<style>.report-form{display:grid;gap:12px;margin:16px 0}.report-form label{display:grid;gap:8px}.report-form input,.report-form textarea{box-sizing:border-box;width:100%;font:inherit;color:inherit;border:1px solid #bdd6cc;border-radius:12px;padding:12px;background:#f6faf7}.report-form button{justify-self:start;font:inherit;border:0;border-radius:20px;background:#285b4c;color:#fff;padding:10px 22px}.report-form button:disabled{opacity:.5}.report-form p{margin:0;font-size:.9rem}.feedback-entry{margin:24px 0}.report-item{padding:20px 0;border-bottom:1px solid #d4e3dc}.report-item p{white-space:pre-wrap;overflow-wrap:anywhere}.report-item a{font-size:.9rem}</style>
<script type="module" src="{{ "/js/feedback.js" | relURL }}?v={{ now.Unix }}"></script>
