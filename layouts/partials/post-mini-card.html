{{ $post := . }}
<article class="mini-card">
  <div class="pill-row">{{ with index $post.Params.categories 0 }}<span class="pill">#{{ . }}</span>{{ end }}</div>
  <h4><a class="post-title-link" href="{{ $post.RelPermalink }}">{{ $post.Title }}</a></h4>
  {{ with $post.Description }}<p>{{ . }}</p>{{ end }}
  <div class="card-footer"><span>{{ $post.Date.Format "2006.01.02" }} · {{ with $post.Params.author }}{{ . }}{{ else }}编辑部{{ end }}</span><a class="text-link" href="{{ $post.RelPermalink }}">阅读全文 →</a></div>
</article>
