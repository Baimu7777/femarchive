baseURL = "https://example.com/"
languageCode = "zh-cn"
title = "女阅组文库 / Feminist Archive"
enableRobotsTXT = true
summaryLength = 120
hasCJKLanguage = true

[pagination]
  pagerSize = 9

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  slogan = "让重要的女性讨论不再只能靠顺藤摸瓜被找到。"
  subtitle = "这里收录值得长期阅读、转引与归档的文章。它更接近文库与 blog，而不是即时发帖流：重点是保存、整理、检索与再次进入。"
  archive_name = "女阅组文库 / Feminist Archive"
  archive_english = "Feminist Archive"
  submit_url = "https://forms.gle/your-google-form-link"

[[menu.main]]
  name = "主页"
  pageRef = "/"
  weight = 10
[[menu.main]]
  name = "全部文章"
  pageRef = "/posts"
  weight = 20
[[menu.main]]
  name = "分类查看"
  pageRef = "/categories"
  weight = 30
[[menu.main]]
  name = "搜索"
  pageRef = "/search"
  weight = 40
[[menu.main]]
  name = "投稿"
  pageRef = "/submit"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params.waline]
  enable = true
  serverURL = "https://your-waline-server.vercel.app"
  lang = "zh-CN"
  pageview = false
  comment = true
