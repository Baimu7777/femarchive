baseURL = "https://example.com/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "女阅组文库 · Feminist Archive"
hasCJKLanguage = true
enableRobotsTXT = true
timeZone = "Asia/Shanghai"
summaryLength = 28

[pagination]
  pagerSize = 12

[permalinks]
  posts = "/posts/:slugorcontentbasename/"
  news = "/news/:slugorcontentbasename/"
  figures = "/figures/:slugorcontentbasename/"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON", "Notifications"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false

[params]
  description = "一个以女性议题、资料归档、新闻整理与原创长文为主的长期文库。"
  slogan = "姦如磐石"
  about = "为被限流、被删帖、被销号的女性之声建立存档，为女性思想创设可被稳定留存、被检索、被看见和铭记的平台。"
  stance = "立场：认可并践行 14BT，包括反性缘部分"
  motto = "我们的身体共振于同一个潮汐，我们的斗争永不止息。"
  groupName = "全女评阅组"
  groupDesc = "书影文舆评分"
  groupURL = "https://www.douban.com/group/762437/"
  infoLeft = "立场：认可并践行 14BT，包括反性缘部分"
  infoRight = "豆瓣小组：全女评阅组 · 书影音与评分"
  homeTopics = ["理论分野", "结构辨析", "语言回声", "狩猎经验", "女身优势", "思考讨论"]
  submitLabel = "前往投稿"
  submitURL = "/submission-guidelines/"
  mainSections = ["posts", "news"]

  [params.author]
    name = ""

  [params.comments]
    enable = true
    provider = "waline"
    serverURL = "https://waline.feminism-nv.top/"
    lang = "zh-CN"
    # 阅读量统计每次打开页面都要调用 Waline，暂时关闭以节省 Vercel 函数用量。
    pageview = false
    reaction = false
    turnstileKey = "0x4AAAAAAC1QJzPCJtEGCRGL"
    # 常用黄脸表情来自 Google Noto Emoji。
    [[params.comments.emoji]]
      name = "常用表情"
      folder = "https://fonts.gstatic.com/s/e/notoemoji/latest"
      icon = "1f603/128"
      type = "png"
      items = [
        "1f600/128", "1f601/128", "1f602/128", "1f603/128", "1f604/128", "1f605/128", "1f606/128", "1f609/128",
        "1f60a/128", "1f60b/128", "1f60c/128", "1f60d/128", "1f60e/128", "1f612/128", "1f613/128", "1f614/128",
        "1f615/128", "1f618/128", "1f61b/128", "1f61d/128", "1f621/128", "1f622/128", "1f624/128", "1f628/128",
        "1f62d/128", "1f62e/128", "1f631/128", "1f633/128", "1f634/128", "1f637/128", "1f641/128", "1f642/128",
        "1f643/128", "1f644/128", "1f914/128", "1f917/128", "1f923/128", "1f92d/128", "1f970/128", "1f97a/128"
      ]

[related]
  includeNewer = true
  threshold = 20
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 80

  [[related.indices]]
    name = "section"
    weight = 20

