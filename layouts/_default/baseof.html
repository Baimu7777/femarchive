<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {{ partial "head.html" . }}
</head>
<body class="body-kind-{{ .Kind }} body-section-{{ .Section }}{{ if .IsHome }} body-home{{ end }}">
  {{ if not .IsHome }}
    {{ partial "header.html" . }}
  {{ end }}
  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "/js/site.js" | relLangURL }}" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
