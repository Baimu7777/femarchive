{{ define "main" }}
  {{ $pages := sort .RegularPages "Date" "desc" }}
  {{ $paginator := .Paginate $pages }}

  <main class="archive-page">
    <div class="shell archive-shell">
      <section class="archive-panel">
        <section class="list-filter">
          <form class="local-filter" data-local-filter data-target="#postsGrid" data-empty="#postsEmpty">
            <label class="sr-only" for="post-filter-input">搜索文章</label>
            <input id="post-filter-input" type="search" placeholder="搜索标题、摘要、标签">
          </form>
        </section>

        <div class="archive-grid" id="postsGrid">
          {{ range $paginator.Pages }}
            {{ partial "card.html" (dict "page" .) }}
          {{ end }}
        </div>

        <p id="postsEmpty" class="empty-state" hidden>没有匹配的文章，换个关键词试试。</p>
        {{ template "_internal/pagination.html" . }}
      </section>
    </div>
  </main>
{{ end }}
