baseURL = "https://example.com/"
languageCode = "zh-cn"
title = "女权文库"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
timeZone = "Asia/Shanghai"
summaryLength = 26
paginate = 10

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[params]
  description = "一个以文章为核心的女权文库站，用于原创长文、讨论整理、转载、归档与备份。"
  slogan = "记录、整理、归档，让文字有去处。"
  subtitle = "原创长文、讨论整理、转载、归档、备份"
  submission_url = "https://docs.google.com/forms/d/e/your-form-id/viewform"
  contact_note = "投稿入口可使用 Google 表单或 Google Spreadsheet。"

[permalinks]
  posts = "/posts/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    name = "主页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "全部文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "分类查看"
    url = "/categories/"
    weight = 3
  [[menu.main]]
    name = "搜索"
    url = "/search/"
    weight = 4
  [[menu.main]]
    name = "投稿"
    url = "/submit/"
    weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[related]
  threshold = 20
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
