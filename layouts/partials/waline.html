{{ if and site.Params.comments.enable (ne .Params.comments false) }}
<section class="comment-panel" id="comments">
  <div class="comment-panel__heading">
    <h2>评论区</h2>
    <button type="button" class="comment-panel__login" id="comment-header-login" hidden>登录</button>
  </div>

  <span class="waline-comment-count" data-path="{{ .Params.comment_path | default .RelPermalink }}" data-comment-read-count hidden></span>
  <div id="waline"></div>
  <p id="waline-status" class="comment-panel__status" hidden></p>
  <noscript>
    <p class="comment-panel__status">当前浏览器禁用了 JavaScript，所以评论组件无法显示。</p>
  </noscript>
</section>

<script type="module">
  import { prepareAnonymousIdentity } from '{{ "/js/comment-avatars.js" | relURL }}';
  import { mountCommentControls } from '{{ "/js/comment-ui.js" | relURL }}?v={{ readFile "static/js/comment-ui.js" | md5 }}';
  const walineRoot = document.getElementById('waline');
  const walineStatus = document.getElementById('waline-status');

  const showWalineStatus = (message) => {
    if (!walineStatus) return;
    walineStatus.hidden = false;
    walineStatus.textContent = message;
  };

  const enablePageview = {{ if site.Params.comments.pageview }}true{{ else }}false{{ end }};

  if (walineRoot) {
    try {
      prepareAnonymousIdentity(window.localStorage, '{{ site.Params.comments.serverURL }}', () => crypto.randomUUID());
      const { init } = await import('/vendor/waline.js?v=attachments-1');

      const isLocal =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';

      init({
        el: walineRoot,
        serverURL: '{{ site.Params.comments.serverURL }}',
        lang: '{{ site.Params.comments.lang | default "zh-CN" }}',
        // A page that moved to its public number keeps the thread it had.
        path: {{ with .Params.comment_path }}{{ . }}{{ else }}window.location.pathname{{ end }},
        pageview: enablePageview && !isLocal,
        reaction: false,
        comment: '.waline-comment-count',
        search: false,
        meta: ['nick'],
        requiredMeta: [],
        turnstileKey: '{{ site.Params.comments.turnstileKey }}',

        emoji: {{ site.Params.comments.emoji | default slice | jsonify | safeJS }},
        locale: {
          placeholder: '欢迎补充资料、勘误或继续讨论。评论功能无需登录，昵称栏留空默认显示“匿名”。'
        }
      });
      mountCommentControls(walineRoot, document.getElementById('comment-header-login'));
    } catch (error) {
      console.error('Waline failed to initialize:', error);
      showWalineStatus('评论区暂时无法加载，请稍后刷新页面再试。');
    }
  }
</script>
{{ end }}
